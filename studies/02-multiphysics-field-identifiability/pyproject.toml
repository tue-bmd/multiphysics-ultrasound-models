[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldid"
version = "0.1.0"
description = "Identifiability and posterior contraction from idealized mechanical and transport fields"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [{name = "Simona Turco", email = "s.turco@tue.nl"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.6,<4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fieldid = "fieldid.cli:main"

[tool.setuptools.packages.find]
include = ["fieldid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
